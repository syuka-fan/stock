  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var theme = (saved === "dark" || saved === "light")
        ? saved
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      if (theme === "dark") document.documentElement.classList.add("dark");
    } catch (e) {}
  })();

<script>
const PAYLOAD = JSON.parse(`{{PAYLOAD_JSON}}`);


const ACTIVE_TAB_CLS = ["bg-blue-600", "text-white", "border-blue-600",
                        "dark:bg-blue-500", "dark:border-blue-500"];
const INACTIVE_TAB_CLS = ["bg-white", "text-gray-600", "border-gray-300", "hover:bg-gray-50",
                          "dark:bg-slate-900", "dark:text-gray-400",
                          "dark:border-slate-600", "dark:hover:bg-slate-800"];

const cssVar = (name) =>
  getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const tabPanes = {
  corr: document.getElementById("tab-corr"),
  trend: document.getElementById("tab-trend"),
  luxury: document.getElementById("tab-luxury"),
};
const mainTabs = document.querySelectorAll(".main-tab");
const tabScrollEl = document.querySelector(".tab-scroll");

// 가로 스크롤 가능 방향에 따라 끝 페이드 토글 (넘치지 않으면 페이드 없음)
function updateTabFade() {
  if (!tabScrollEl) return;
  const sl = tabScrollEl.scrollLeft;
  const max = tabScrollEl.scrollWidth - tabScrollEl.clientWidth;
  const canLeft = sl > 1;
  const canRight = sl < max - 1;
  tabScrollEl.classList.toggle("fade-lr", canLeft && canRight);
  tabScrollEl.classList.toggle("fade-l", canLeft && !canRight);
  tabScrollEl.classList.toggle("fade-r", canRight && !canLeft);
}

function activateMainTab(name) {
  let activeBtn = null;
  mainTabs.forEach(b => {
    const isActive = b.dataset.mainTab === name;
    if (isActive) { document.title = b.textContent.trim(); activeBtn = b; }
    b.classList.remove(...ACTIVE_TAB_CLS, ...INACTIVE_TAB_CLS);
    b.classList.add(...(isActive ? ACTIVE_TAB_CLS : INACTIVE_TAB_CLS));
  });
  Object.entries(tabPanes).forEach(([key, pane]) => {
    const isActive = key === name;
    pane.classList.toggle("hidden", !isActive);
    if (key === "trend") pane.classList.toggle("flex", isActive);
  });
  // 활성 탭이 숨어 있으면 가로로만 보이게 스크롤 (세로 점프 방지: block nearest)
  if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
  updateTabFade();
}
mainTabs.forEach(b => b.addEventListener("click", () => activateMainTab(b.dataset.mainTab)));
activateMainTab("corr");

if (tabScrollEl) {
  tabScrollEl.addEventListener("scroll", updateTabFade, { passive: true });
  new ResizeObserver(updateTabFade).observe(tabScrollEl);
  window.addEventListener("resize", updateTabFade);
  requestAnimationFrame(updateTabFade);  // 후원 버튼 등장 등 레이아웃 확정 후 초기 반영
}

/* =================== THEME TOGGLE =================== */
const THEME_KEY = "theme";
const themeBtn = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");

function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === "dark") root.classList.add("dark");
  else root.classList.remove("dark");
  themeIcon.textContent = (theme === "dark") ? "☀️" : "🌙";
}

applyTheme(document.documentElement.classList.contains("dark") ? "dark" : "light");

themeBtn.addEventListener("click", () => {
  const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
  renderCorrBody();
  renderTrendGrid();
});

/* =================== DONATION (5+ days after first visit) =================== */
(function setupDonation() {
  const FIRST_VISIT_KEY = "firstVisitDate";
  const SHOW_AFTER_DAYS = 5;
  const el = document.getElementById("donation-link");
  if (!el) return;

  const toLocalYMD = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };
  const parseLocalYMD = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  };

  let stored = null;
  try { stored = localStorage.getItem(FIRST_VISIT_KEY); } catch (e) { return; }

  const now = new Date();
  const todayYMD = toLocalYMD(now);

  if (!stored) {
    try { localStorage.setItem(FIRST_VISIT_KEY, todayYMD); } catch (e) {}
    return;
  }

  const first = parseLocalYMD(stored);
  if (!first) return;

  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.floor((todayMidnight - first) / 86400000);

  if (diffDays >= SHOW_AFTER_DAYS) {
    el.classList.remove("hidden");
  }
})();

/* =================== CORR SUB-TABS =================== */
const corrSubtabsEl = document.getElementById("corr-subtabs");
const corrBodyEl = document.getElementById("corr-body");
const subKeys = PAYLOAD.corr.tab_keys;
let activeCorrKey = "overall";
const CORR_CELLVAL_KEY = "corrShowCellValues";
let showCellValues = (() => {
  try { return localStorage.getItem(CORR_CELLVAL_KEY) === "1"; }
  catch (e) { return false; }
})();
document.getElementById("toggle-cell-values").checked = showCellValues;

function subLabel(key) {
  return key === "overall" ? "전체요약" : `${key}월`;
}

function renderCorrSubtabs() {
  corrSubtabsEl.innerHTML = "";
  for (const key of subKeys) {
    const btn = document.createElement("button");
    btn.textContent = subLabel(key);
    const isActive = key === activeCorrKey;
    btn.className = "px-3 py-2 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition-colors " +
      (isActive
        ? "border-blue-600 text-blue-700 dark:border-blue-400 dark:text-blue-300"
        : "border-transparent text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100");
    btn.addEventListener("click", () => {
      activeCorrKey = key;
      renderCorrSubtabs();
      renderCorrBody();
    });
    corrSubtabsEl.appendChild(btn);
  }
}

/* =================== HEATMAP =================== */
const corrColor = d3.scaleDiverging()
  .domain([-1, 0, 1])
  .interpolator(t => d3.interpolateRdBu(1 - t));

const LABEL_W = 180;
const PAD_R = 16;

function chooseCell(n, containerW) {
  const avail = Math.max(0, containerW - LABEL_W - PAD_R);
  const ideal = Math.floor(avail / n);
  return Math.max(11, Math.min(32, ideal));
}

// 셀 크기에 따라 표시 포맷과 폰트를 동시에 결정. 표시 불가하면 null.
function pickTextStyle(cell) {
  const targets = [
    { chars: 5, format: "full" },   // "-0.99"
    { chars: 4, format: "drop0" },  // "-.99"
    { chars: 3, format: "onedec" }, // "-.9"
  ];
  for (const t of targets) {
    const maxFont = Math.floor(cell / (t.chars * 0.6));
    if (maxFont >= 7) {
      return { format: t.format, font: Math.min(12, maxFont) };
    }
  }
  return null;
}

function formatCellValue(v, format) {
  if (format === "full") return v.toFixed(2);
  const sign = v < 0 ? "-" : "";
  if (format === "drop0") return sign + Math.abs(v).toFixed(2).replace(/^0/, "");
  if (format === "onedec") return sign + Math.abs(v).toFixed(1).replace(/^0/, "");
  return "";
}

async function downloadSvgAsPng(svgEl, filename) {
  const clone = svgEl.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

  // 외부 CSS에 의존하는 클래스를 직렬화 SVG에 인라인으로 주입 (캡처 시 폰트/색 보존)
  const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
  style.textContent =
    `text { font-family: 'Noto Sans KR', system-ui, sans-serif; }
     .axis text { fill: ${cssVar("--text-axis")}; font-size: 11px; }
     .cell-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
     .cbar-axis text { fill: ${cssVar("--text-axis-2")}; font-size: 10px; }
     .cbar-axis line, .cbar-axis path { stroke: ${cssVar("--stroke-axis")}; fill: none; }
     .chart-axis text { fill: ${cssVar("--text-axis-2")}; font-size: 10px; }
     .chart-axis line { stroke: ${cssVar("--stroke-grid")}; }
     .chart-axis path { stroke: ${cssVar("--stroke-axis-soft")}; fill: none; }
     .month-divider   { stroke: ${cssVar("--stroke-axis-soft")}; stroke-width: 1; }
     .zero-line       { stroke: ${cssVar("--stroke-axis-soft")}; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
     .month-label     { fill: ${cssVar("--text-axis-3")}; font-size: 10px; text-anchor: middle; }`;
  clone.insertBefore(style, clone.firstChild);

  const vb = svgEl.viewBox.baseVal;
  const w = vb && vb.width ? vb.width : svgEl.clientWidth || 800;
  const h = vb && vb.height ? vb.height : svgEl.clientHeight || 600;
  // 오프스크린 렌더링 시 페이지의 width:100%/max-width 영향을 받지 않도록 명시
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  clone.style.maxWidth = "none";
  clone.style.width = w + "px";
  clone.style.height = h + "px";

  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const DPR = 2;

  try {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    const ctx = canvas.getContext("2d");
    const bg = getComputedStyle(document.body).backgroundColor;
    ctx.fillStyle = (bg && bg !== "rgba(0, 0, 0, 0)") ? bg : "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(img, 0, 0, w, h);

    await new Promise((resolve) => {
      canvas.toBlob((blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        resolve();
      }, "image/png");
    });
  } finally {
    URL.revokeObjectURL(url);
  }
}

function drawHeatmap(container, chart, containerW, titleLine1, titleLine2) {
  const { labels, matrix } = chart;
  const n = labels.length;
  const cell = chooseCell(n, containerW);
  const labelW = LABEL_W;
  const xLabelH = 140;
  const cbarGap = 36;
  const cbarH = 26;
  const cbarTickH = 22;
  const padR = PAD_R;
  const padB = 8;
  const titleH = (titleLine1 || titleLine2) ? 56 : 0;

  const gridW = n * cell;
  const gridH = n * cell;
  const width = labelW + gridW + padR;
  const height = titleH + gridH + xLabelH + cbarGap + cbarH + cbarTickH + padB;

  const wrap = container.append("div").attr("class", "overflow-x-auto overflow-y-hidden");
  const svg = wrap.append("svg")
    .attr("class", "heatmap block")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("max-width", "100%")
    .style("width", "100%")
    .style("height", "auto");

  // 캡처 시 컨텍스트가 함께 보이도록 SVG 안에 타이틀 텍스트 박아넣기
  if (titleH > 0) {
    const titleG = svg.append("g").attr("class", "heatmap-title");
    titleG.append("text")
      .attr("x", 8).attr("y", 24)
      .attr("fill", cssVar("--text-axis"))
      .style("font-family", "'Noto Sans KR', system-ui, sans-serif")
      .style("font-size", "16px")
      .style("font-weight", "700")
      .text(titleLine1 || "");
    titleG.append("text")
      .attr("x", 8).attr("y", 44)
      .attr("fill", cssVar("--text-axis-3"))
      .style("font-family", "'Noto Sans KR', system-ui, sans-serif")
      .style("font-size", "12px")
      .text(titleLine2 || "");
  }

  const ox = labelW;
  const oy = titleH;

  // 셀 (하삼각, 대각선 제외)
  const g = svg.append("g").attr("transform", `translate(${ox},${oy})`);
  const textStyle = pickTextStyle(cell);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < i; j++) {
      const v = matrix[i] ? matrix[i][j] : null;
      const x = j * cell, y = i * cell;
      g.append("rect")
        .attr("x", x).attr("y", y)
        .attr("width", cell).attr("height", cell)
        .attr("fill", v == null ? cssVar("--cell-null") : corrColor(v))
        .attr("stroke", cssVar("--cell-stroke")).attr("stroke-width", 0.5);
      if (v != null && showCellValues && textStyle) {
        const txtColor = Math.abs(v) > 0.55 ? cssVar("--text-on-strong") : cssVar("--text-on-light");
        g.append("text")
          .attr("class", "cell-text")
          .attr("x", x + cell / 2)
          .attr("y", y + cell / 2 + textStyle.font * 0.35)
          .attr("text-anchor", "middle")
          .attr("fill", txtColor)
          .style("font-size", `${textStyle.font}px`)
          .text(formatCellValue(v, textStyle.format));
      }
    }
  }

  // y축 라벨 (첫 라벨 i==0 생략)
  const yAxis = svg.append("g").attr("class", "axis")
    .attr("transform", `translate(${ox - 6},${oy})`);
  labels.forEach((lab, i) => {
    if (i === 0) return;
    yAxis.append("text")
      .attr("x", 0)
      .attr("y", i * cell + cell / 2 + 4)
      .attr("text-anchor", "end")
      .text(lab);
  });

  // x축 라벨 (마지막 j==n-1 생략)
  const xAxis = svg.append("g").attr("class", "axis")
    .attr("transform", `translate(${ox},${oy + gridH + 6})`);
  labels.forEach((lab, j) => {
    if (j === n - 1) return;
    xAxis.append("text")
      .attr("x", 0).attr("y", 0)
      .attr("text-anchor", "end")
      .attr("transform", `translate(${j * cell + cell / 2},0) rotate(-45)`)
      .text(lab);
  });

  // 가로 컬러바 (격자 하단)
  const cbarX = ox;
  const cbarY = oy + gridH + xLabelH + cbarGap;
  const gradId = `grad-${Math.random().toString(36).slice(2)}`;
  const defs = svg.append("defs");
  const grad = defs.append("linearGradient")
    .attr("id", gradId)
    .attr("x1", "0%").attr("y1", "0%")
    .attr("x2", "100%").attr("y2", "0%");
  const stops = 20;
  for (let s = 0; s <= stops; s++) {
    const t = s / stops;
    const v = -1 + 2 * t;
    grad.append("stop")
      .attr("offset", `${t * 100}%`)
      .attr("stop-color", corrColor(v));
  }
  svg.append("rect")
    .attr("x", cbarX).attr("y", cbarY)
    .attr("width", gridW).attr("height", cbarH)
    .attr("fill", `url(#${gradId})`)
    .attr("stroke", cssVar("--stroke-axis-soft"));

  const cbarScale = d3.scaleLinear().domain([-1, 1]).range([0, gridW]);
  const cbarAxis = d3.axisBottom(cbarScale)
    .tickValues([-1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1])
    .tickFormat(d3.format(".2f"));
  svg.append("g")
    .attr("class", "cbar-axis")
    .attr("transform", `translate(${cbarX},${cbarY + cbarH})`)
    .call(cbarAxis);
}

/* =================== TREND CHARTS =================== */
const MIN_SAMPLES = PAYLOAD.trend.min_samples;
const trendMonths = PAYLOAD.trend.months;
const monthOrder = new Map(trendMonths.map((m, i) => [m, i]));

const T_W = 320, T_H = 180;
const T_MARGIN = { top: 6, right: 6, bottom: 22, left: 36 };
const T_PW = T_W - T_MARGIN.left - T_MARGIN.right;
const T_PH = T_H - T_MARGIN.top - T_MARGIN.bottom;

function buildPosMap(rows) {
  const seen = new Map();
  for (const r of rows) {
    const k = `${r.month}-${r.day_idx}`;
    if (!seen.has(k)) seen.set(k, { month: r.month, day_idx: r.day_idx });
  }
  const arr = Array.from(seen.values()).sort((a, b) =>
    (monthOrder.get(a.month) - monthOrder.get(b.month)) ||
    (a.day_idx - b.day_idx));
  const lookup = new Map();
  arr.forEach((k, i) => lookup.set(`${k.month}-${k.day_idx}`, i));
  return { arr, lookup };
}

function monthStartsOf(posArr) {
  const starts = new Map();
  posArr.forEach((k, i) => {
    if (!starts.has(k.month)) starts.set(k.month, i);
  });
  return starts;
}

function drawFrame(g, x, y, posArr) {
  g.append("line").attr("class", "zero-line")
    .attr("x1", 0).attr("x2", T_PW)
    .attr("y1", y(0)).attr("y2", y(0));

  const yAxis = d3.axisLeft(y).ticks(4).tickSize(-T_PW).tickFormat(d3.format(".2f"));
  const yg = g.append("g").attr("class", "chart-axis").call(yAxis);
  yg.select(".domain").remove();

  const starts = monthStartsOf(posArr);
  const months = Array.from(starts.keys());
  for (let i = 0; i < months.length; i++) {
    const m = months[i];
    const start = starts.get(m);
    const end = (i + 1 < months.length) ? starts.get(months[i + 1]) : posArr.length;
    const mid = (start + end - 1) / 2;
    g.append("text").attr("class", "month-label")
      .attr("x", x(mid)).attr("y", T_PH + 14)
      .text(`${m}월`);
  }
}

function drawMonthDividers(g, x, posArr) {
  const starts = monthStartsOf(posArr);
  const months = Array.from(starts.keys());
  for (let i = 1; i < months.length; i++) {
    const p = starts.get(months[i]);
    g.append("line").attr("class", "month-divider")
      .attr("x1", x(p - 0.5)).attr("x2", x(p - 0.5))
      .attr("y1", 0).attr("y2", T_PH);
  }
}

function yScaleFrom(values) {
  const finite = values.filter(v => Number.isFinite(v));
  let yMin = Math.min(0, d3.min(finite));
  let yMax = Math.max(0, d3.max(finite));
  if (!Number.isFinite(yMin) || !Number.isFinite(yMax)) { yMin = -1; yMax = 1; }
  const span = yMax - yMin;
  const pad = span > 0 ? span * 0.05 : 0.1;
  return d3.scaleLinear().domain([yMin - pad, yMax + pad]).range([T_PH, 0]);
}

function makeChartG(parent) {
  const svg = parent.append("svg")
    .attr("class", "chart w-full block")
    .attr("viewBox", `0 0 ${T_W} ${T_H}`)
    .attr("preserveAspectRatio", "xMidYMid meet");
  return svg.append("g").attr("transform", `translate(${T_MARGIN.left},${T_MARGIN.top})`);
}

function drawBand(parent, chart) {
  if (!chart || !chart.rows || chart.rows.length === 0) {
    parent.append("div").attr("class", "text-xs text-gray-400 dark:text-gray-500 italic py-4 text-center")
      .text("데이터 없음");
    return false;
  }
  const rows = chart.rows;
  const { arr: posArr, lookup } = buildPosMap(rows);
  const x = d3.scaleLinear().domain([-0.5, posArr.length - 0.5]).range([0, T_PW]);
  const y = yScaleFrom(rows.flatMap(r => [r.upper, r.lower]));

  const g = makeChartG(parent);
  drawFrame(g, x, y, posArr);

  const sorted = rows
    .map(r => ({ pos: lookup.get(`${r.month}-${r.day_idx}`), ...r }))
    .sort((a, b) => a.pos - b.pos);

  let hasLowSample = false;
  if (chart.shade_low_sample) {
    const halfCell = (x(1) - x(0)) / 2;
    for (const d of sorted) {
      if (d.n_years < MIN_SAMPLES) {
        hasLowSample = true;
        g.append("rect")
          .attr("x", x(d.pos) - halfCell).attr("width", halfCell * 2)
          .attr("y", 0).attr("height", T_PH)
          .attr("fill", "crimson").attr("fill-opacity", 0.18);
      }
    }
  }

  const area = d3.area()
    .x(d => x(d.pos))
    .y0(d => y(d.lower))
    .y1(d => y(d.upper))
    .defined(d => Number.isFinite(d.lower) && Number.isFinite(d.upper));
  g.append("path").datum(sorted)
    .attr("fill", "steelblue").attr("fill-opacity", 0.22).attr("d", area);

  const line = d3.line()
    .x(d => x(d.pos))
    .y(d => y(d.median))
    .defined(d => Number.isFinite(d.median));
  g.append("path").datum(sorted)
    .attr("fill", "none").attr("stroke", "steelblue")
    .attr("stroke-width", 1.5).attr("d", line);

  drawMonthDividers(g, x, posArr);
  return hasLowSample;
}

function drawLines(parent, chart) {
  if (!chart || !chart.rows || chart.rows.length === 0) {
    parent.append("div").attr("class", "text-xs text-gray-400 dark:text-gray-500 italic py-4 text-center")
      .text("데이터 없음");
    return;
  }
  const rows = chart.rows;
  const { arr: posArr, lookup } = buildPosMap(rows);
  const x = d3.scaleLinear().domain([-0.5, posArr.length - 0.5]).range([0, T_PW]);
  const y = yScaleFrom(rows.map(r => r.cumflow));

  const byYear = d3.group(rows, r => r.year);
  const years = Array.from(byYear.keys()).sort((a, b) => a - b);
  const palette = d3.schemeTableau10;
  const colorByYear = yr => palette[Math.max(0, years.indexOf(yr)) % palette.length];

  const lg = parent.append("div")
    .attr("class", "flex flex-wrap gap-x-2 gap-y-0.5 text-[10px] text-gray-500 dark:text-gray-400 mb-0.5");
  for (const yr of years) {
    const item = lg.append("span").attr("class", "inline-flex items-center gap-1");
    item.append("span")
      .attr("class", "inline-block w-2.5 h-0.5 rounded-sm")
      .style("background", colorByYear(yr));
    item.append("span").text(yr);
  }

  const g = makeChartG(parent);
  drawFrame(g, x, y, posArr);

  const line = d3.line()
    .x(d => x(d.pos))
    .y(d => y(d.cumflow))
    .defined(d => Number.isFinite(d.cumflow));
  for (const yr of years) {
    const pts = byYear.get(yr)
      .map(r => ({ pos: lookup.get(`${r.month}-${r.day_idx}`), cumflow: r.cumflow }))
      .sort((a, b) => a.pos - b.pos);
    g.append("path").datum(pts)
      .attr("fill", "none")
      .attr("stroke", colorByYear(yr))
      .attr("stroke-width", 1.3)
      .attr("d", line);
  }

  drawMonthDividers(g, x, posArr);
}


const STORAGE_KEY = "tickers";
const tickersByStem = new Map(PAYLOAD.trend.tickers.map(t => [t.stem, t]));
const allStems = PAYLOAD.trend.tickers.map(t => t.stem);
const defaultOrder = PAYLOAD.trend.default_order.filter(s => tickersByStem.has(s));

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { selected: [] };
    const obj = JSON.parse(raw);
    if (obj.version !== 1 || !Array.isArray(obj.selected)) return { selected: [] };
    const valid = new Set(allStems);
    return { selected: obj.selected.filter(s => valid.has(s)) };
  } catch { return { selected: [] }; }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY,
      JSON.stringify({ version: 1, selected: state.selected }));
  } catch (e) { console.warn("localStorage 저장 실패:", e); }
}

const state = loadState();

const HINT_KEY = "trendHintShown_v1";

})();
function markHintShown() {
  firstHintShown = true;
  try { sessionStorage.setItem(HINT_KEY, "1"); } catch (e) {}

function matchSearch(title) {
  if (!searchQuery) return true;
  return title.toLowerCase().includes(searchQuery);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderDrawer() {
  listEl.innerHTML = "";

  const selectedSet = new Set(state.selected);
  const selectedItems = state.selected
    .map(s => tickersByStem.get(s))
    .filter(t => t && matchSearch(t.title));
  const unselectedItems = allStems
    .filter(s => !selectedSet.has(s))
    .map(s => tickersByStem.get(s))
    .filter(t => t && matchSearch(t.title));

  // 선택됨 그룹
  const selH = document.createElement("div");
  selH.className = "px-2 py-1.5 text-xs text-gray-500 dark:text-gray-400 font-medium flex items-center justify-between";
  selH.innerHTML = `<span>선택됨 (${state.selected.length})</span><span class="text-[10px]">⋮ 드래그</span>`;
  listEl.appendChild(selH);

  for (const t of selectedItems) {
    const row = document.createElement("div");
    row.className = "ticker-row flex items-center gap-1 px-2 py-1 text-sm rounded hover:bg-gray-50 dark:hover:bg-slate-800";
    row.dataset.stem = t.stem;
    row.dataset.group = "selected";
    row.draggable = true;
    row.innerHTML = `
      <span class="drag-handle text-gray-400 dark:text-gray-500 select-none px-0.5">⋮</span>
      <input type="checkbox" class="cb" checked>
      <span class="flex-1 min-w-0 truncate" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</span>
      <button class="remove-btn text-gray-400 dark:text-gray-500 hover:text-red-500 px-1" title="제거" aria-label="제거">×</button>
    `;
    bindRowEvents(row, t.stem, true);
    listEl.appendChild(row);
  }

  if (selectedItems.length === 0) {
    const empty = document.createElement("div");
    empty.className = "px-2 py-2 text-xs text-gray-400 dark:text-gray-500 italic";
    empty.textContent = searchQuery ? "검색 결과 없음" : "선택된 티커 없음";
    listEl.appendChild(empty);
  }

  // 미선택 그룹
  const unsH = document.createElement("div");
  unsH.className = "mt-3 px-2 py-1.5 text-xs text-gray-500 dark:text-gray-400 font-medium";
  unsH.textContent = `미선택 (${allStems.length - state.selected.length})`;
  listEl.appendChild(unsH);

  unselectedItems.forEach((t, i) => {
    const row = document.createElement("div");
    let cls = "ticker-row flex items-center gap-1 px-2 py-1 text-sm rounded hover:bg-gray-50 dark:hover:bg-slate-800";
    if (!firstHintShown && state.selected.length === 0 && !searchQuery && i === 0) {
      cls += " first-hint";
    }
    row.className = cls;
    row.dataset.stem = t.stem;
    row.dataset.group = "unselected";
    row.innerHTML = `
      <span class="inline-block w-3"></span>
      <input type="checkbox" class="cb">
      <span class="flex-1 min-w-0 truncate" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</span>
    `;
    bindRowEvents(row, t.stem, false);
    listEl.appendChild(row);
  });

  if (unselectedItems.length === 0 && searchQuery) {
    const empty = document.createElement("div");
    empty.className = "px-2 py-2 text-xs text-gray-400 dark:text-gray-500 italic";
    empty.textContent = "검색 결과 없음 (미선택)";
    listEl.appendChild(empty);
  }
}

function bindRowEvents(row, stem, isSelected) {
  const cb = row.querySelector(".cb");
  cb.addEventListener("change", () => {
    if (cb.checked) addStem(stem); else removeStem(stem);
  });
  const rm = row.querySelector(".remove-btn");
  if (rm) rm.addEventListener("click", () => removeStem(stem));

  if (isSelected) {
    row.addEventListener("dragstart", e => {
      row.classList.add("dragging");
      e.dataTransfer.setData("text/plain", stem);
      e.dataTransfer.effectAllowed = "move";
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      document.querySelectorAll(".drop-target").forEach(el => el.classList.remove("drop-target"));
    });
    row.addEventListener("dragover", e => {
      const fromStem = e.dataTransfer.types.includes("text/plain") ? null : null;
      if (row.dataset.group !== "selected") return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      document.querySelectorAll(".drop-target").forEach(el => el.classList.remove("drop-target"));
      row.classList.add("drop-target");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-target"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      const fromStem = e.dataTransfer.getData("text/plain");
      if (!fromStem || fromStem === stem) return;
      moveStemBefore(fromStem, stem);
    });
  }
}

function addStem(stem) {
  markHintShown();
  if (!state.selected.includes(stem)) state.selected.push(stem);
  saveState(); renderAll();
}
function removeStem(stem) {
  state.selected = state.selected.filter(s => s !== stem);
  saveState(); renderAll();
}
function moveStemBefore(fromStem, toStem) {
  const arr = state.selected.slice();
  const fromIdx = arr.indexOf(fromStem);
  if (fromIdx < 0) return;
  arr.splice(fromIdx, 1);
  const toIdx = arr.indexOf(toStem);
  if (toIdx < 0) { arr.push(fromStem); }
  else { arr.splice(toIdx, 0, fromStem); }
  state.selected = arr;
  saveState(); renderAll();
}

function renderQuickPicks() {
  const el = document.getElementById("trend-empty-quickpicks");
  if (!el) return;
  el.innerHTML = "";
  const pool = (defaultOrder.length ? defaultOrder : allStems).slice(0, 3);
  for (const stem of pool) {
    const t = tickersByStem.get(stem);
    if (!t) continue;
    const btn = document.createElement("button");
    btn.className = "px-3 py-1.5 text-sm rounded-full border border-blue-300 dark:border-blue-700 " +
                    "text-blue-700 dark:text-blue-300 " +
                    "hover:bg-blue-50 dark:hover:bg-blue-900/30 max-w-[14rem] truncate";
    btn.textContent = `+ ${t.title}`;
    btn.title = `추가: ${t.title}`;
    btn.addEventListener("click", () => addStem(stem));
    el.appendChild(btn);
  }
}

function renderTrendGrid() {
  gridEl.innerHTML = "";
  countEl.textContent = `${state.selected.length} / ${allStems.length} 선택`;

  const captureBtn = document.getElementById("trend-capture-btn");

  if (state.selected.length === 0) {
    emptyEl.classList.remove("hidden");
    gridEl.classList.add("hidden");
    if (captureBtn) captureBtn.classList.add("hidden");
    renderQuickPicks();
    return;
  }
  emptyEl.classList.add("hidden");
  gridEl.classList.remove("hidden");
  if (captureBtn) captureBtn.classList.remove("hidden");

  const root = d3.select(gridEl);
  for (const stem of state.selected) {
    const t = tickersByStem.get(stem);
    if (!t) continue;

    const card = root.append("article")
      .attr("class", "border dark:border-slate-700 rounded p-2 bg-white dark:bg-slate-800 min-w-0");
    card.append("h3")
      .attr("class", "text-sm font-semibold mb-1 truncate")
      .attr("title", t.title)
      .text(t.title);

    const charts = card.append("div")
      .attr("class", "grid grid-cols-1 sm:grid-cols-2 gap-2");

    // 전체
    const all = charts.append("figure").attr("class", "min-w-0");
    all.append("figcaption")
      .attr("class", "text-[11px] text-gray-500 dark:text-gray-400 mb-0.5")
      .text("전체");
    if (t.all) {
      if (t.all.type === "band") {
        if (drawBand(all, t.all)) {
          const note = all.append("div")
            .attr("class", "low-sample-note text-[10px] leading-tight text-rose-600 dark:text-rose-400 mt-1");
          note.append("div").attr("class", "ls-note-line")
            .text(`⚠ 빨간 음영은 표본 연도 ${MIN_SAMPLES}년 미만 구간으로, 해석에 주의가 필요합니다.`);
        }
      } else {
        drawLines(all, t.all);
      }
    } else {
      all.append("div").attr("class", "text-xs text-gray-400 dark:text-gray-500 italic py-4 text-center")
        .text("데이터 없음");
    }

    // 최근 5년
    const rec = charts.append("figure").attr("class", "min-w-0");
    const recCap = rec.append("figcaption")
      .attr("class", "text-[11px] text-gray-500 dark:text-gray-400 mb-0.5 flex items-center gap-1");
    recCap.append("span").text("최근 5년");
    if (t.recent && t.recent.mode_label) {
      const ml = t.recent.mode_label;
      const cls = ml.cls === "band"
        ? "bg-sky-100 text-sky-700 dark:bg-sky-900 dark:text-sky-200"
        : "bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-200";
      recCap.append("span")
        .attr("class", `inline-block text-[9px] font-medium px-1.5 py-0.5 rounded-full ${cls}`)
        .text(ml.text);
    }
    if (t.recent) {
      if (t.recent.type === "band") drawBand(rec, t.recent);
      else drawLines(rec, t.recent);
    } else {
      rec.append("div").attr("class", "text-xs text-gray-400 dark:text-gray-500 italic py-4 text-center")
        .text("데이터 없음");
    }
  }
}

const SVG_NS = "http://www.w3.org/2000/svg";

function captureTrendGrid() {
  if (state.selected.length === 0) return Promise.resolve();

  const cards = Array.from(gridEl.querySelectorAll("article"));
  if (cards.length === 0) return Promise.resolve();

  const isDark = document.documentElement.classList.contains("dark");
  const cardBg = isDark ? "#1e293b" : "#ffffff";
  const cardBorder = cssVar("--stroke-grid") || (isDark ? "#1f2937" : "#eef2f7");
  const titleColor = cssVar("--text-axis") || (isDark ? "#e5e7eb" : "#1f2937");
  const captionColor = cssVar("--text-axis-3") || (isDark ? "#94a3b8" : "#6b7280");

  const PAD = 8;
  const gridRect = gridEl.getBoundingClientRect();
  const totalW = Math.ceil(gridRect.width);
  const totalH = Math.ceil(gridRect.height);

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("xmlns", SVG_NS);
  svg.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
  svg.setAttribute("width", totalW);
  svg.setAttribute("height", totalH);
  svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);

  for (const card of cards) {
    const cr = card.getBoundingClientRect();
    const cx = cr.left - gridRect.left;
    const cy = cr.top - gridRect.top;
    const cw = cr.width;
    const ch = cr.height;

    const cardG = document.createElementNS(SVG_NS, "g");
    cardG.setAttribute("transform", `translate(${cx},${cy})`);

    const bg = document.createElementNS(SVG_NS, "rect");
    bg.setAttribute("x", 0);
    bg.setAttribute("y", 0);
    bg.setAttribute("width", cw);
    bg.setAttribute("height", ch);
    bg.setAttribute("rx", 4);
    bg.setAttribute("fill", cardBg);
    bg.setAttribute("stroke", cardBorder);
    bg.setAttribute("stroke-width", 1);
    cardG.appendChild(bg);

    const titleEl = card.querySelector("h3");
    if (titleEl) {
      const tr = titleEl.getBoundingClientRect();
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", PAD);
      t.setAttribute("y", (tr.top - cr.top) + tr.height - 4);
      t.setAttribute("fill", titleColor);
      t.setAttribute("font-size", 13);
      t.setAttribute("font-weight", 600);
      t.textContent = titleEl.textContent;
      cardG.appendChild(t);
    }

    const figures = card.querySelectorAll("figure");
    for (const fig of figures) {
      const fr = fig.getBoundingClientRect();
      const fx = fr.left - cr.left;
      const fy = fr.top - cr.top;

      const caption = fig.querySelector("figcaption");
      if (caption) {
        const capParts = Array.from(caption.children).length > 0
          ? Array.from(caption.children).map(c => c.textContent.trim()).filter(Boolean).join(" ")
          : caption.textContent.trim();
        const capR = caption.getBoundingClientRect();
        const ct = document.createElementNS(SVG_NS, "text");
        ct.setAttribute("x", fx);
        ct.setAttribute("y", (capR.top - cr.top) + capR.height - 2);
        ct.setAttribute("fill", captionColor);
        ct.setAttribute("font-size", 11);
        ct.textContent = capParts;
        cardG.appendChild(ct);
      }

      const chartSvg = fig.querySelector("svg");
      if (chartSvg) {
        const sr = chartSvg.getBoundingClientRect();
        const sx = sr.left - cr.left;
        const sy = sr.top - cr.top;
        const clone = chartSvg.cloneNode(true);
        clone.setAttribute("x", sx);
        clone.setAttribute("y", sy);
        clone.setAttribute("width", sr.width);
        clone.setAttribute("height", sr.height);
        clone.removeAttribute("class");
        clone.style.maxWidth = "none";
        cardG.appendChild(clone);

        const noteEl = fig.querySelector(".low-sample-note");
        if (noteEl) {
          const noteColor = isDark ? "#fb7185" : "#e11d48";
          for (const lineEl of noteEl.querySelectorAll(".ls-note-line")) {
            const lr = lineEl.getBoundingClientRect();
            const lt = document.createElementNS(SVG_NS, "text");
            lt.setAttribute("x", lr.left - cr.left);
            lt.setAttribute("y", (lr.top - cr.top) + lr.height - 2);
            lt.setAttribute("fill", noteColor);
            lt.setAttribute("font-size", 10);
            lt.textContent = lineEl.textContent.trim();
            cardG.appendChild(lt);
          }
        }
      } else {
        const noData = fig.querySelector("div");
        if (noData) {
          const nr = noData.getBoundingClientRect();
          const nt = document.createElementNS(SVG_NS, "text");
          nt.setAttribute("x", fx + nr.width / 2);
          nt.setAttribute("y", (nr.top - cr.top) + nr.height / 2);
          nt.setAttribute("fill", captionColor);
          nt.setAttribute("font-size", 11);
          nt.setAttribute("text-anchor", "middle");
          nt.setAttribute("font-style", "italic");
          nt.textContent = noData.textContent.trim();
          cardG.appendChild(nt);
        }
      }
    }

    svg.appendChild(cardG);
  }

  const ymd = new Date().toLocaleDateString("sv-SE");
  return downloadSvgAsPng(svg, `trend_${ymd}.png`);
}

document.getElementById("trend-capture-btn").addEventListener("click", () => {
  captureTrendGrid().catch(err => console.error("PNG 저장 실패:", err));
});

/* =================== LUXURY (명품 소비재) =================== */
const luxuryEl = document.getElementById("tab-luxury");
const LUX_DATA = PAYLOAD.luxury || {};
const luxParseDate = d3.timeParse("%Y-%m-%d");

// 종목명 -> 날짜순 정렬된 [{t: Date, year, v: 0~100}] (전체기간 기준 정규화 값 그대로)
const luxSeries = {};
let luxMinYear = Infinity, luxMaxYear = -Infinity;
for (const [name, obj] of Object.entries(LUX_DATA)) {
  const arr = Object.entries(obj)
    .map(([d, v]) => { const t = luxParseDate(d); return t ? { t, year: t.getFullYear(), v } : null; })
    .filter(Boolean)
    .sort((a, b) => a.t - b.t);
  if (!arr.length) continue;
  luxSeries[name] = arr;
  luxMinYear = Math.min(luxMinYear, arr[0].year);
  luxMaxYear = Math.max(luxMaxYear, arr[arr.length - 1].year);
}
const luxNames = Object.keys(luxSeries);
const luxPalette = d3.schemeTableau10;
const luxColor = name => luxPalette[Math.max(0, luxNames.indexOf(name)) % luxPalette.length];

// 최신 연도 기준 5년 단위로 끊는다(달력 경계가 아니라 가장 최근 연도부터 역산).
// 따라서 최신 구간은 항상 "최근 5년"으로 꽉 찬다.
const LUX_BUCKET_SIZE = 5;
const LUX_MIN_BUCKET_YEARS = 3;

// 5년 구간 [{lo, hi}] 최신 -> 과거. 가장 오래된 구간 연수가 너무 적으면 직전 구간에 흡수.
function luxBuildBuckets() {
  if (!luxNames.length) return [];
  const bounds = [];
  for (let hi = luxMaxYear; hi >= luxMinYear; hi -= LUX_BUCKET_SIZE) {
    bounds.push({ lo: hi - (LUX_BUCKET_SIZE - 1), hi });
  }
  const distinctYears = (lo, hi) => {
    const set = new Set();
    for (const name of luxNames)
      for (const p of luxSeries[name])
        if (p.year >= lo && p.year <= hi) set.add(p.year);
    return set.size;
  };
  if (bounds.length >= 2) {
    const last = bounds[bounds.length - 1];
    if (distinctYears(last.lo, last.hi) < LUX_MIN_BUCKET_YEARS) {
      bounds[bounds.length - 2].lo = last.lo;
      bounds.pop();
    }
  }
  return bounds;
}

const LUX_W = 820, LUX_H = 160;
const LUX_M = { top: 10, right: 14, bottom: 24, left: 36 };
const LUX_PW = LUX_W - LUX_M.left - LUX_M.right;
const LUX_PH = LUX_H - LUX_M.top - LUX_M.bottom;

function luxDrawLegend(parent) {
  const row = parent.append("div").attr("class", "flex items-start gap-2 mb-4");
  const lg = row.append("div")
    .attr("class", "lux-legend flex flex-wrap gap-x-3 gap-y-1 text-xs text-gray-600 dark:text-gray-300 flex-1 min-w-0");
  for (const name of luxNames) {
    const item = lg.append("span").attr("class", "inline-flex items-center gap-1.5");
    item.append("span").attr("class", "inline-block w-3 h-0.5 rounded").style("background", luxColor(name));
    item.append("span").text(name);
  }
  row.append("button")
    .attr("type", "button")
    .attr("title", "명품 소비재 전체를 PNG로 저장")
    .attr("class", "shrink-0 self-start px-2 py-1 text-xs border border-gray-300 dark:border-slate-600 rounded text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors")
    .text("📷 PNG")
    .on("click", () => {
      captureLuxury().catch(err => console.error("PNG 저장 실패:", err));
    });
}

function luxDrawChart(parent, title, lo, hi) {
  const series = luxNames
    .map(name => ({ name, pts: luxSeries[name].filter(p => p.year >= lo && p.year <= hi) }))
    .filter(s => s.pts.length);

  const card = parent.append("section").attr("class", "mb-6");
  card.append("h3").attr("class", "text-sm font-semibold mb-1").text(title);

  if (!series.length) {
    card.append("div").attr("class", "text-xs text-gray-400 dark:text-gray-500 italic py-4").text("데이터 없음");
    return;
  }

  const xDomain = d3.extent(series.flatMap(s => s.pts), p => p.t);
  const svg = card.append("svg")
    .attr("class", "chart block")
    .attr("viewBox", `0 0 ${LUX_W} ${LUX_H}`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("width", "100%").style("height", "auto");
  const g = svg.append("g").attr("transform", `translate(${LUX_M.left},${LUX_M.top})`);

  const x = d3.scaleTime().domain(xDomain).range([0, LUX_PW]);
  const y = d3.scaleLinear().domain([0, 100]).range([LUX_PH, 0]);

  const yg = g.append("g").attr("class", "chart-axis")
    .call(d3.axisLeft(y).ticks(5).tickSize(-LUX_PW));
  yg.select(".domain").remove();

  g.append("g").attr("class", "chart-axis")
    .attr("transform", `translate(0,${LUX_PH})`)
    .call(d3.axisBottom(x).ticks(8).tickFormat(d3.timeFormat("%Y년")));

  const line = d3.line().x(p => x(p.t)).y(p => y(p.v)).defined(p => Number.isFinite(p.v));
  for (const s of series) {
    g.append("path").datum(s.pts)
      .attr("fill", "none").attr("stroke", luxColor(s.name))
      .attr("stroke-width", 1.2).attr("stroke-opacity", 0.85).attr("d", line);
  }
}

// 탭 전체(범례 + 모든 차트)를 하나의 SVG로 합성해 PNG로 저장.
// captureTrendGrid 와 동일하게 getBoundingClientRect 로 위치를 측정한다.
function captureLuxury() {
  if (!luxNames.length) return Promise.resolve();

  const rootRect = luxuryEl.getBoundingClientRect();
  const totalW = Math.ceil(rootRect.width);
  const totalH = Math.ceil(rootRect.height);

  const isDark = document.documentElement.classList.contains("dark");
  const titleColor = cssVar("--text-axis") || (isDark ? "#e5e7eb" : "#1f2937");
  const labelColor = cssVar("--text-axis-2") || (isDark ? "#cbd5e1" : "#374151");

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("xmlns", SVG_NS);
  svg.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
  svg.setAttribute("width", totalW);
  svg.setAttribute("height", totalH);
  svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);

  // 범례 (스와치는 캡처 시 가독성을 위해 살짝 두껍게)
  const legendEl = luxuryEl.querySelector(".lux-legend");
  if (legendEl) {
    for (const item of legendEl.querySelectorAll(":scope > span")) {
      const swatch = item.querySelector("span:first-child");
      const label = item.querySelector("span:last-child");
      const sw = swatch.getBoundingClientRect();
      const rect = document.createElementNS(SVG_NS, "rect");
      rect.setAttribute("x", sw.left - rootRect.left);
      rect.setAttribute("y", (sw.top - rootRect.top) + sw.height / 2 - 1.5);
      rect.setAttribute("width", sw.width);
      rect.setAttribute("height", 3);
      rect.setAttribute("rx", 1.5);
      rect.setAttribute("fill", getComputedStyle(swatch).backgroundColor);
      svg.appendChild(rect);

      const lr = label.getBoundingClientRect();
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", lr.left - rootRect.left);
      t.setAttribute("y", (lr.top - rootRect.top) + lr.height - 3);
      t.setAttribute("fill", labelColor);
      t.setAttribute("font-size", 12);
      t.textContent = label.textContent;
      svg.appendChild(t);
    }
  }

  // 차트 섹션 (전체 + 5년 버킷)
  for (const section of luxuryEl.querySelectorAll("section")) {
    const h3 = section.querySelector("h3");
    if (h3) {
      const hr = h3.getBoundingClientRect();
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", hr.left - rootRect.left);
      t.setAttribute("y", (hr.top - rootRect.top) + hr.height - 4);
      t.setAttribute("fill", titleColor);
      t.setAttribute("font-size", 13);
      t.setAttribute("font-weight", 600);
      t.textContent = h3.textContent;
      svg.appendChild(t);
    }

    const chartSvg = section.querySelector("svg.chart");
    if (chartSvg) {
      const sr = chartSvg.getBoundingClientRect();
      const clone = chartSvg.cloneNode(true);
      clone.setAttribute("x", sr.left - rootRect.left);
      clone.setAttribute("y", sr.top - rootRect.top);
      clone.setAttribute("width", sr.width);
      clone.setAttribute("height", sr.height);
      clone.removeAttribute("class");
      clone.style.maxWidth = "none";
      svg.appendChild(clone);
    } else {
      const noData = section.querySelector("div");
      if (noData) {
        const nr = noData.getBoundingClientRect();
        const nt = document.createElementNS(SVG_NS, "text");
        nt.setAttribute("x", nr.left - rootRect.left);
        nt.setAttribute("y", (nr.top - rootRect.top) + nr.height / 2);
        nt.setAttribute("fill", labelColor);
        nt.setAttribute("font-size", 11);
        nt.setAttribute("font-style", "italic");
        nt.textContent = noData.textContent.trim();
        svg.appendChild(nt);
      }
    }
  }

  const ymd = new Date().toLocaleDateString("sv-SE");
  return downloadSvgAsPng(svg, `luxury_${ymd}.png`);
}

function renderLuxury() {
  luxuryEl.innerHTML = "";
  const root = d3.select(luxuryEl);
  if (!luxNames.length) {
    root.append("div")
      .attr("class", "text-sm text-gray-400 dark:text-gray-500 italic py-8 text-center")
      .text("명품 소비재 데이터가 없습니다.");
    return;
  }
  luxDrawLegend(root);
  luxDrawChart(root, "전체", luxMinYear, luxMaxYear);
  const grid = root.append("div")
    .attr("class", "grid grid-cols-1 md:grid-cols-2 gap-x-6");
  for (const b of luxBuildBuckets()) {
    let aMin = Infinity, aMax = -Infinity;
    for (const name of luxNames)
      for (const p of luxSeries[name])
        if (p.year >= b.lo && p.year <= b.hi) { aMin = Math.min(aMin, p.year); aMax = Math.max(aMax, p.year); }
    luxDrawChart(grid, aMin === aMax ? `${aMin}년` : `${aMin}년 ~${aMax}년`, b.lo, b.hi);
  }
}

function renderAll() {
  renderDrawer();
  renderTrendGrid();
}

renderLuxury();
renderAll();
